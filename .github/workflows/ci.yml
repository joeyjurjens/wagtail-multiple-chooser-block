name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - py311-django52-wagtail74
          - py314-django60-wagtail74
          - py311-django52-wagtail80
          - py314-django61-wagtail80
          - py314-django61-wagtail81
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uvx playwright install-deps chromium
      - run: uvx --with tox-uv tox run -e ${{ matrix.env }}
