[tox]
requires =
    tox>=4.30
    tox-uv>=1.28
# A representative range of the supported versions, including the lowest and
# highest combinations. See
# https://docs.wagtail.org/en/stable/releases/upgrading.html#compatible-django-python-versions
env_list =
    py{310,313}-django52-wagtail70
    py{312,314}-django{52,60}-wagtail74
    py{310,314}-django52-wagtail80
    py{312,314}-django{60,61}-wagtail80

[testenv]
description = Run the tests
dependency_groups = dev
deps =
    django52: django~=5.2.0
    django60: django~=6.0.0
    django61: django~=6.1.0
    wagtail70: wagtail~=7.0.0
    wagtail74: wagtail~=7.4.0
    wagtail80: wagtail~=8.0.0
commands_pre =
    playwright install chromium
commands =
    pytest {posargs}
