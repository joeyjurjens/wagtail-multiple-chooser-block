[tox]
requires =
    tox>=4.30
    tox-uv>=1.28
# The supported Wagtail versions, with the lowest and highest Python and
# Django of each. See
# https://docs.wagtail.org/en/stable/releases/upgrading.html#compatible-django-python-versions
env_list =
    py311-django52-wagtail74
    py314-django60-wagtail74
    py311-django52-wagtail80
    py314-django61-wagtail80
    py314-django61-wagtail81

[testenv]
description = Run the tests
dependency_groups = dev
deps =
    django52: django~=5.2.0
    django60: django~=6.0.0
    django61: django~=6.1.0
    wagtail74: wagtail~=7.4.0
    wagtail80: wagtail~=8.0.0
    wagtail81: wagtail~=8.1.0
commands_pre =
    playwright install chromium
commands =
    pytest {posargs}
