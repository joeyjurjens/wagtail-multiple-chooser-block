{% load wagtailcore_tags wagtailimages_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; color: #262626; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.25rem; }
        figure { margin: 0; }
        img { display: block; width: 100%; height: auto; border-radius: 6px; }
        figcaption { margin-top: 0.5rem; font-size: 0.95rem; }
    </style>
</head>
<body>
    <h1>{{ page.title }}</h1>
    {% for block in page.body %}
        {% if block.block_type == "captioned_images" %}
            <div class="gallery">
                {% for item in block.value %}
                    <figure>
                        {% image item.image fill-320x240 %}
                        <figcaption>{{ item.caption }}</figcaption>
                    </figure>
                {% endfor %}
            </div>
        {% else %}
            {% include_block block %}
        {% endif %}
    {% endfor %}
</body>
</html>
